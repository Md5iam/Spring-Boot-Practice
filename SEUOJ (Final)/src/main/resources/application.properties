spring.application.name=SEUOJ

# PostgreSQL Database Configuration
spring.datasource.url= ${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USER}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
seuoj.app.jwtSecret=3cfa76f14193b2591b61c7d24d2629b35b6a7b7e7a7a7b7c7d7e7f8a8b8c8d8e
seuoj.app.jwtExpirationMs=86400000

# Native Judge Engine (g++, javac, python3 must be available on PATH)
# No external API keys required.

server.port=8081