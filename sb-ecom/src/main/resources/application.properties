spring.application.name=sb-ecom

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:test

project.image=images

spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.formate_sql=create-drop

spring.app.jwtSecret=mySecretKeyThatIsLongEnoughForHS512AlgorithmToWork
spring.app.jwtExpirationMS=86400000

logging.level.org.springframework=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.example.project=DEBUG

spring.ecom.app.jwtCookieName=springBootEcom
